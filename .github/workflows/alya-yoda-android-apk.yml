name: Alya Yoda - Android APK (public runner, no paid AI)
on:
  push:
    branches: ["experiment/alya-yoda-android-one-icon-20261122"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        run: |
          base64 -d android-one-icon-payload.b64 > /tmp/android-one-icon.zip
          unzip -q /tmp/android-one-icon.zip
          python android-one-icon/test_project.py
          node --check android-one-icon/app/src/main/assets/yodabridge/page.js
          node --check android-one-icon/app/src/main/assets/yodabridge/bridge.js
      - name: Inspect Android UI and login source (temporary developer diagnostics)
        run: |
          find android-one-icon/app/src/main -type f | sort | head -100
          for f in android-one-icon/app/src/main/AndroidManifest.xml android-one-icon/app/src/main/java/hu/alya/yoda/MainActivity.java android-one-icon/app/src/main/java/hu/alya/yoda/VoiceCommands.java android-one-icon/app/src/main/assets/yodabridge/page.js android-one-icon/app/src/main/assets/yodabridge/bridge.js; do
            if [ -f "$f" ]; then
              echo "::group::SOURCE $f"
              sed -n '1,360p' "$f"
              echo "::endgroup::"
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$MANAGER"
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble APK
        working-directory: android-one-icon
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installer
        uses: actions/upload-artifact@v4
        with:
          name: ALYA-YODA-ANDROID-APK
          path: android-one-icon/app/build/outputs/apk/debug/*.apk
          retention-days: 7
